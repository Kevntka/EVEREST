<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVEREST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background image with overlay */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                        url('https://pixabay.com/images/download/x-1937040_1920.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Fallback background color if image doesn't load */
            
        }

        .login-container {
            background: white;
            padding: 40px 50px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f5f5f5;
            transition: all 0.3s ease;
        }

        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #ff5555;
            background-color: white;
        }

        .captcha-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .captcha-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .captcha-container label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #ff5555;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 12px;
        }

        .btn-login:hover {
            background-color: #ff3333;
        }

        .btn-create {
            width: 100%;
            padding: 14px;
            background-color: white;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-create:hover {
            border-color: #bbb;
            background-color: #f9f9f9;
        }

        .forgot-password {
            text-align: center;
        }

        .forgot-password a {
            color: #999;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #ff5555;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Log In</h1>
            <p>Access your Account to Continue</p>
        </div>

        <form action="/api/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder=""
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder=""
                >
            </div>

            <div class="captcha-container">
                <input 
                    type="checkbox" 
                    id="captcha" 
                    name="captcha" 
                    required
                >
                <label for="captcha">I'm not a robot</label>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <button type="button" class="btn-create" onclick="window.location.href='/register'">
            Create Account
        </button>

        <div class="forgot-password">
            <a href="/forgot-password"><u>Forgot Password?</u></a>
        </div>
    </div>
</body>
</html>
