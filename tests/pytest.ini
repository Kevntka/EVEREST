[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers -m "not screenshots"
markers =
    auth: login, logout, registration, email verification, password reset
    api: endpoint status codes, response formats, error handling
    functional: CRUD, dashboards, data persistence
    scheduling: event dates/times, registration windows, capacity (fully booked)
    security: authentication, access control, tokens, injection, XSS, CSRF, rate limits
    ratelimit: starts its own backend process (slower)
    e2e: Playwright browser tests (need the Angular dev server on :4200)
    screenshots: captures the QA matrix images (run explicitly with -m screenshots)
# Playwright: keep screenshots and traces only for failures
# (pytest-playwright options; see tests/README.md)
