<div class="dark-mode-toggle" (click)="toggleDarkMode()">
  <!-- Moon icon when in Light Mode (click to go Dark) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="!themeService.isDarkMode()">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <!-- Sun icon when in Dark Mode (click to go Light) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="themeService.isDarkMode()">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <span class="dark-mode-text">{{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
</div>

<div class="forgot-password-container">
  <div class="forgot-password-header">
    <h1>Forgot Password</h1>
    <p>Enter your account email to request a password reset link.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
    <div class="form-group">
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email"
        placeholder="Account Email"
        required 
      >
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-confirm" [disabled]="!forgotPasswordForm.form.valid || isSaving">
      {{ isSaving ? 'Sending...' : 'Confirm' }}
    </button>
  </form>

  <div class="back-link">
    <a (click)="goToLogin()">← Back to Login</a>
  </div>
</div>
