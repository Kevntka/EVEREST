<div class="forgot-password-container">
  <div class="forgot-password-header">
    <h1>Forgot Password</h1>
    <p>Enter your email to request a password reset link.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
    <div class="form-group">
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email"
        placeholder="Email"
        required 
      >
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-confirm" [disabled]="!forgotPasswordForm.form.valid">
      Confirm
    </button>
  </form>

  <div class="back-link">
    <a (click)="goToLogin()">← Back to Login</a>
  </div>
</div>
