<div class="dark-mode-toggle" (click)="toggleDarkMode()">
  <!-- Moon icon when in Light Mode (click to go Dark) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="!themeService.isDarkMode()">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <!-- Sun icon when in Dark Mode (click to go Light) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="themeService.isDarkMode()">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <span class="dark-mode-text">{{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
</div>

<div class="login-container">
  <div class="login-header">
    <h1>Log In</h1>
    <p>Access your Account to Continue</p>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email"
        required 
        placeholder=""
      >
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          id="password" 
          name="password" 
          class="password-input"
          [(ngModel)]="password"
          required 
          placeholder=""
        >
        <button
          type="button"
          class="password-toggle"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <lucide-icon [img]="showPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Google reCAPTCHA v2 -->
    <div class="captcha-container">
      <!-- Rendered by renderRecaptcha() with the current theme (no data-sitekey, so Google doesn't auto-render a light one) -->
      <div class="g-recaptcha"></div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-login" [disabled]="!loginForm.form.valid || isSubmitting">
      {{ isSubmitting ? 'Logging in...' : 'Log In' }}
    </button>
  </form>

  <button type="button" class="btn-create" routerLink="/register">
    Create Account
  </button>

  <div class="forgot-password">
    <a routerLink="/forgot-password">Forgot Password?</a>
  </div>
</div>
