<div class="login-container">
  <div class="login-header">
    <h1>Log In</h1>
    <p>Access your Account to Continue</p>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email"
        required 
        placeholder=""
      >
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="password"
        required 
        placeholder=""
      >
    </div>

    <!-- Google reCAPTCHA v2 -->
    <div class="captcha-container">
      <div 
        class="g-recaptcha" 
        [attr.data-sitekey]="recaptchaSiteKey"
        (load)="onRecaptchaLoad()"
      ></div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-login" [disabled]="!loginForm.form.valid || isSubmitting">
      {{ isSubmitting ? 'Logging in...' : 'Log In' }}
    </button>
  </form>

  <button type="button" class="btn-create" routerLink="/register">
    Create Account
  </button>

  <div class="forgot-password">
    <a routerLink="/forgot-password">Forgot Password?</a>
  </div>
</div>
