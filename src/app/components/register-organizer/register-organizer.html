<div class="dark-mode-toggle" (click)="toggleDarkMode()">
  <!-- Moon icon when in Light Mode (click to go Dark) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="!themeService.isDarkMode()">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <!-- Sun icon when in Dark Mode (click to go Light) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="themeService.isDarkMode()">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <span class="dark-mode-text">{{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
</div>

<div class="register-container">
  <div class="register-header">
    <h1>Organizer Registration</h1>
    <p>Create an Account to Host Events</p>
  </div>

  <form (ngSubmit)="onSubmit()" #organizerForm="ngForm">
    <div class="form-group">
      <input
        type="text"
        id="fullName"
        name="fullName"
        [(ngModel)]="fullName"
        placeholder="Full Name"
        autocomplete="name"
        maxlength="150"
        required
      >
    </div>
    <div class="form-group">
      <input
        type="text"
        id="employmentId"
        name="employmentId"
        [(ngModel)]="employmentId"
        placeholder="Employment ID"
        maxlength="50"
        required
      >
    </div>
    <div class="form-group">
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        autocomplete="email"
          pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
        required
      >
    </div>
    <div class="form-group">
      <input
        type="text"
        id="department"
        name="department"
        [(ngModel)]="department"
        placeholder="Department"
        maxlength="150"
        required
      >
    </div>
    <div class="form-group">
      <input
        type="tel"
        id="contactNumber"
        name="contactNumber"
        [(ngModel)]="contactNumber"
        placeholder="Contact Number (optional)"
        autocomplete="tel"
      >
    </div>
    <div class="form-group">
      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          name="password"
          class="password-input"
          [(ngModel)]="password"
          placeholder="Enter Password"
          required
        >
        <button
          type="button"
          class="password-toggle"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <lucide-icon [img]="showPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="form-group">
      <div class="password-wrapper">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          id="confirmPassword"
          name="confirmPassword"
          class="password-input"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter Password"
          required
        >
        <button
          type="button"
          class="password-toggle"
          (click)="showConfirmPassword = !showConfirmPassword"
          [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
        >
          <lucide-icon [img]="showConfirmPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
        </button>
      </div>
      @if (confirmPassword) {
        <p class="match-hint" [class.ok]="confirmPassword === password">
          <lucide-icon [img]="confirmPassword === password ? Check : X" [size]="13"></lucide-icon>
          {{ confirmPassword === password ? 'Passwords match' : 'Passwords do not match' }}
        </p>
      }
      @if (password) {
        <app-password-checklist [password]="password"></app-password-checklist>
      }
    </div>


    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-register" [disabled]="!organizerForm.form.valid || isSaving">
      {{ isSaving ? 'Registering...' : 'Register' }}
    </button>
  </form>

  <div class="back-link">
    Already have an account? <a (click)="goToLogin()">Log In</a>
  </div>
</div>
