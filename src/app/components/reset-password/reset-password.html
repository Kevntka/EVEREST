<div class="dark-mode-toggle" (click)="toggleDarkMode()">
  <!-- Moon icon when in Light Mode (click to go Dark) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="!themeService.isDarkMode()">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <!-- Sun icon when in Dark Mode (click to go Light) -->
  <svg class="dark-mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="themeService.isDarkMode()">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <span class="dark-mode-text">{{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
</div>

<div class="reset-password-container">
  <div class="reset-password-header">
    <h1>Set New Password</h1>
    <p>Enter and confirm your new password</p>
  </div>

  <form (ngSubmit)="resetPassword()">
      <div class="form-group">
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="password-input"
            placeholder="Enter New Password"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <lucide-icon [img]="showPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="form-group">
        <div class="password-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="password-input"
            placeholder="Re-enter New Password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <lucide-icon [img]="showConfirmPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
          </button>
        </div>
        <app-password-checklist [password]="newPassword"></app-password-checklist>
      </div>

    <button type="submit" class="btn-submit" [disabled]="isLoading">
      {{ isLoading ? 'Resetting...' : 'Reset Password' }}
    </button>

    <button type="button" class="btn-back" (click)="backToLogin()">
      Back to Log In
    </button>
  </form>
</div>
