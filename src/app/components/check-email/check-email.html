<div class="check-email-container">
  <div class="check-email-header">
    <h1>Check Your Email</h1>
    <p>If an account exists for this email, you will receive a password reset link.</p>
    <p class="instruction">Check your inbox and spam folder.</p>
  </div>

  <button type="button" class="btn-back-login" (click)="backToLogin()">
    Back to Log In
  </button>

  <div class="try-another">
    <a (click)="tryAnotherEmail()">Try Another Email</a>
  </div>
</div>
